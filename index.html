<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa desbloqueável</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
#map{position:absolute;inset:0;background:#cfd6dd}
#ui{position:absolute;z-index:1000;top:10px;left:10px;width:248px;background:#15202bf2;color:#e8edf2;border-radius:10px;padding:10px;box-shadow:0 4px 18px #0006;max-height:calc(100% - 20px);overflow:auto}
#ui.min{width:auto}#ui.min>*:not(#head){display:none}
#head{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:8px}
#ui.min #head{margin:0;gap:10px}
#ui button{font:inherit;color:inherit;background:#26384a;border:1px solid #3a5068;border-radius:7px;padding:6px 9px;cursor:pointer}
#ui button:hover{background:#2f465c}
#ui button:focus-visible,#ui input:focus-visible{outline:2px solid #f2b84b;outline-offset:1px}
#ui button.on{background:#f2b84b;color:#15202b;border-color:#f2b84b;font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.seg button{flex:1}
label{display:flex;align-items:center;gap:8px;margin-bottom:8px}
input[type=range]{flex:1;accent-color:#f2b84b}
#q{width:100%;padding:6px 8px;border-radius:7px;border:1px solid #3a5068;background:#0e161e;color:inherit;margin-bottom:8px;font:inherit}
#stat{color:#9fb0c0;font-size:12px}
#hint{color:#f2b84b;font-size:12px;margin-bottom:8px;min-height:1em}
#toast{position:absolute;z-index:1100;left:50%;bottom:22px;transform:translateX(-50%);background:#15202bf2;color:#fff;padding:9px 14px;border-radius:8px;max-width:90%;display:none}
#fog{pointer-events:none}
</style>
</head>
<body>
<div id="map"></div>
<div id="ui">
  <div id="head"><span>Mapa desbloqueável</span><button id="min" title="Recolher">–</button></div>
  <div class="row seg" id="modes">
    <button data-m="nav" class="on">Navegar</button>
    <button data-m="path">Traçar</button>
    <button data-m="brush">Pincel</button>
  </div>
  <div id="hint"></div>
  <label>Raio <input id="rad" type="range" min="20" max="500" step="10" value="100"><b id="radv">100 m</b></label>
  <div class="row">
    <button id="done" hidden>Concluir trecho</button>
    <button id="undo">Desfazer</button>
    <button id="loc">Seguir minha posição</button>
  </div>
  <div class="row">
    <button id="imp">Importar arquivo</button>
    <button id="exp">Salvar backup</button>
  </div>
  <label><input type="checkbox" id="fogchk" checked> Mostrar névoa</label>
  <input id="q" placeholder="Ir para um lugar (Enter)">
  <div id="stat"></div>
  <div class="row" style="margin:8px 0 0"><button id="wipe">Apagar tudo</button></div>
  <input type="file" id="file" accept=".gpx,.kml,.xml,.json,.geojson" multiple hidden>
</div>
<div id="toast"></div>

<script>
/* ---------- Dados: células de ~38 m (tile z20), cada uma guarda o raio revelado ---------- */
const Z = 20, CELL = 256, M = 2097152;
const cells = new Map();          // chave numérica -> raio (m)
const history = [];               // ações para desfazer
let cur = null;                   // ação em andamento
let added = 0;

function toCell(lat, lon) {
  const s = Math.sin(Math.max(-85, Math.min(85, lat)) * Math.PI / 180), N = CELL * 2 ** Z;
  const x = (lon + 180) / 360 * N, y = (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * N;
  return [Math.floor(x / CELL), Math.floor(y / CELL)];
}
function add(lat, lon, r) {
  const [cx, cy] = toCell(lat, lon), k = cx * M + cy, p = cells.get(k);
  if (p === undefined || p < r) {
    cells.set(k, r);
    if (cur) cur.push([k, p]);
    if (p === undefined) added++;
  }
}
function addLine(pts, r, gap) {
  pts = pts.filter(p => isFinite(p[0]) && isFinite(p[1]) && Math.abs(p[0]) <= 85);
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i]; add(a[0], a[1], r);
    if (!i) continue;
    const b = pts[i - 1];
    const dx = (a[1] - b[1]) * Math.cos((a[0] + b[0]) * Math.PI / 360) * 111320, dy = (a[0] - b[0]) * 110540;
    const d = Math.hypot(dx, dy);
    if (d > gap) continue;
    const n = Math.min(Math.ceil(d / Math.max(12, r * .7)), 20000);
    for (let j = 1; j < n; j++) { const t = j / n; add(b[0] + (a[0] - b[0]) * t, b[1] + (a[1] - b[1]) * t, r); }
  }
}
function commit() {
  if (cur && cur.length) history.push(cur);
  cur = null; schedule(); save(); stats();
}
function undo() {
  const h = history.pop(); if (!h) return;
  for (let i = h.length - 1; i >= 0; i--) { const [k, p] = h[i]; p === undefined ? cells.delete(k) : cells.set(k, p); }
  schedule(); save(); stats();
}

/* ---------- Persistência (IndexedDB) + backup em arquivo ---------- */
const DB = new Promise((res, rej) => {
  try {
    const q = indexedDB.open('mapa-desbloqueavel', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('kv');
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  } catch (e) { rej(e); }
});
const kvGet = k => DB.then(db => new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
const kvSet = (k, v) => DB.then(db => new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }));
const flat = () => { const a = new Float64Array(cells.size * 2); let i = 0; for (const [k, r] of cells) { a[i++] = k; a[i++] = r; } return a; };
let saveT = 0;
function save() { clearTimeout(saveT); saveT = setTimeout(() => kvSet('cells', flat()).catch(() => toast('Não consegui salvar no navegador. Use "Salvar backup".')), 400); }
function saveView() { kvSet('view', [map.getCenter().lat, map.getCenter().lng, map.getZoom()]).catch(() => {}); }
function exportBackup() {
  const blob = new Blob([JSON.stringify({ app: 'mapa-desbloqueavel', v: 1, cells: Array.from(flat()) })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'mapa-desbloqueado-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- Mapa ---------- */
const map = L.map('map', { zoomControl: false, zoomAnimation: false, doubleClickZoom: false, worldCopyJump: false, minZoom: 2 });
L.control.zoom({ position: 'bottomright' }).addTo(map);
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Esri' });
osm.addTo(map);
L.control.layers({ 'OpenStreetMap': osm, 'Satélite': sat }, null, { position: 'topright' }).addTo(map);

/* ---------- Névoa (canvas) ---------- */
map.createPane('fog').style.zIndex = 450;
map.createPane('draw').style.zIndex = 460;
const cv = document.createElement('canvas'); cv.id = 'fog';
map.getPane('fog').appendChild(cv);
const ctx = cv.getContext('2d');
let fogOn = true, raf = 0;
const schedule = () => { if (!raf) raf = requestAnimationFrame(draw); };
function draw() {
  raf = 0;
  const s = map.getSize(), d = devicePixelRatio || 1;
  if (cv.width !== s.x * d || cv.height !== s.y * d) { cv.width = s.x * d; cv.height = s.y * d; cv.style.width = s.x + 'px'; cv.style.height = s.y + 'px'; }
  L.DomUtil.setPosition(cv, map.containerPointToLayerPoint([0, 0]));
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, s.x, s.y);
  if (!fogOn) return;
  ctx.fillStyle = 'rgba(22,26,34,.88)'; ctx.fillRect(0, 0, s.x, s.y);
  const z = map.getZoom(), N = CELL * 2 ** z, sc = 2 ** (z - Z), tl = map.project(map.containerPointToLatLng([0, 0]), z);
  ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = '#000';
  const seen = new Set(), pm = N / 40075016.686;
  for (const [k, r] of cells) {
    const cx = Math.floor(k / M), cy = k - cx * M;
    const wx = (cx + .5) * CELL * sc, wy = (cy + .5) * CELL * sc;
    const sx = wx - tl.x, sy = wy - tl.y, rp = r * pm * Math.cosh(Math.PI * (1 - 2 * wy / N));
    if (sx < -rp || sy < -rp || sx > s.x + rp || sy > s.y + rp) continue;
    if (rp < 4) { const b = (Math.floor(sx / 2) + 1000) * 8192 + Math.floor(sy / 2) + 1000; if (seen.has(b)) continue; seen.add(b); }
    ctx.beginPath(); ctx.arc(sx, sy, Math.max(rp, 1.2), 0, 6.2832); ctx.fill();
  }
}
map.on('move zoom viewreset resize', schedule);
map.on('moveend', saveView);

/* ---------- Ferramentas: traçar / pincel ---------- */
const $ = id => document.getElementById(id);
const rad = () => +$('rad').value;
let mode = 'nav', verts = [];
const preview = L.polyline([], { color: '#f2b84b', weight: 3, dashArray: '6 6', pane: 'draw' }).addTo(map);
const hints = { nav: '', path: 'Clique para marcar pontos do caminho; Enter conclui, Esc cancela.', brush: 'Segure e arraste para pintar por onde você passou.' };
function setMode(m) {
  cancelPath(); mode = m;
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('hint').textContent = hints[m]; $('done').hidden = m !== 'path';
  m === 'brush' ? map.dragging.disable() : map.dragging.enable();
  map.getContainer().style.cursor = m === 'nav' ? '' : 'crosshair';
  map.getContainer().style.touchAction = m === 'brush' ? 'none' : '';
}
function cancelPath() { verts = []; preview.setLatLngs([]); }
function finishPath() {
  if (!verts.length) return;
  cur = []; addLine(verts, rad(), 1e9); cancelPath(); commit();
}
map.on('click', e => { if (mode !== 'path') return; verts.push([e.latlng.lat, e.latlng.lng]); preview.setLatLngs(verts); });

const con = map.getContainer(); let down = false, last = null;
function paint(e) {
  const p = map.mouseEventToLatLng(e), c = [p.lat, p.lng];
  addLine(last ? [last, c] : [c], rad(), 1e9); last = c; schedule();
}
con.addEventListener('pointerdown', e => {
  if (mode !== 'brush' || e.button > 0 || e.target.closest('.leaflet-control')) return;
  down = true; cur = []; last = null; con.setPointerCapture(e.pointerId); paint(e);
});
con.addEventListener('pointermove', e => { if (down) paint(e); });
const up = () => { if (down) { down = false; commit(); } };
con.addEventListener('pointerup', up); con.addEventListener('pointercancel', up);

/* ---------- Importação (GPX, KML, GeoJSON, JSON do Google, backup) ---------- */
function parseFile(name, text) {
  const lines = []; let gap = 150000;
  if (/\.(gpx|kml|xml)$/i.test(name) || text.trimStart().startsWith('<')) {
    const d = new DOMParser().parseFromString(text, 'text/xml');
    const q = t => [...d.getElementsByTagNameNS('*', t)];
    const pt = (p, a, b) => [+p.getAttribute(a), +p.getAttribute(b)];
    q('trkseg').forEach(s => lines.push([...s.getElementsByTagNameNS('*', 'trkpt')].map(p => pt(p, 'lat', 'lon'))));
    q('rte').forEach(s => lines.push([...s.getElementsByTagNameNS('*', 'rtept')].map(p => pt(p, 'lat', 'lon'))));
    q('wpt').forEach(p => lines.push([pt(p, 'lat', 'lon')]));
    q('coordinates').forEach(c => lines.push(c.textContent.trim().split(/\s+/).map(t => t.split(',')).filter(a => a.length >= 2).map(a => [+a[1], +a[0]])));
    const g = q('coord').map(c => { const a = c.textContent.trim().split(/\s+/); return [+a[1], +a[0]]; });
    if (g.length) lines.push(g);
    return { lines, gap };
  }
  let j;
  try { j = JSON.parse(text); } catch (e) {
    // JSON cortado ou inválido: varre as coordenadas direto no texto, na ordem em que aparecem
    const pts = [], rx2 = /(-?\d{1,3}\.\d+)\s*°\s*,\s*(-?\d{1,3}\.\d+)\s*°/g; let m;
    while ((m = rx2.exec(text))) pts.push([+m[1], +m[2]]);
    if (!pts.length) throw e;
    lines.push(pts); return { lines, gap: 5000 };
  }
  if (j && j.type) {
    const coords = c => {
      if (!Array.isArray(c) || !c.length) return;
      if (typeof c[0] === 'number') return lines.push([[c[1], c[0]]]);
      if (typeof c[0][0] === 'number') return lines.push(c.map(p => [p[1], p[0]]));
      c.forEach(coords);
    };
    const geo = o => {
      if (!o) return;
      if (o.type === 'FeatureCollection') o.features.forEach(geo);
      else if (o.type === 'Feature') geo(o.geometry);
      else if (o.type === 'GeometryCollection') o.geometries.forEach(geo);
      else coords(o.coordinates);
    };
    geo(j); return { lines, gap };
  }
  const pts = [], rx = /^(?:geo:)?\s*(-?\d{1,3}\.\d+)\s*°?\s*,\s*(-?\d{1,3}\.\d+)\s*°?\s*$/;
  const walk = o => {
    if (typeof o === 'string') { const m = o.match(rx); if (m) pts.push([+m[1], +m[2]]); return; }
    if (!o || typeof o !== 'object') return;
    if (!Array.isArray(o)) {
      if (o.latitudeE7 != null && o.longitudeE7 != null) pts.push([o.latitudeE7 / 1e7, o.longitudeE7 / 1e7]);
      else if (typeof o.latitude === 'number' && typeof o.longitude === 'number') pts.push([o.latitude, o.longitude]);
      else if (typeof o.lat === 'number' && (typeof o.lng === 'number' || typeof o.lon === 'number')) pts.push([o.lat, o.lng ?? o.lon]);
    }
    for (const v of Object.values(o)) walk(v);
  };
  walk(j); lines.push(pts); gap = 5000;
  return { lines, gap };
}
async function importFiles(files) {
  const before = cells.size; cur = []; let n = 0; const fail = [];
  for (const f of files) {
    try {
      const text = await f.text();
      if (text.slice(0, 80).includes('mapa-desbloqueavel')) {
        const j = JSON.parse(text);
        for (let i = 0; i < j.cells.length; i += 2) { const k = j.cells[i], r = j.cells[i + 1], p = cells.get(k); if (p === undefined || p < r) { cells.set(k, r); cur.push([k, p]); } }
        n++; continue;
      }
      const { lines, gap } = parseFile(f.name, text);
      lines.forEach(l => addLine(l, rad(), gap)); n++;
    } catch (e) { fail.push(f.name); }
  }
  commit();
  const novas = cells.size - before;
  toast((n ? n + ' arquivo(s) importado(s): ' + novas.toLocaleString('pt-BR') + ' novas células reveladas. ' : '') + (fail.length ? 'Não consegui ler: ' + fail.join(', ') : ''));
  if (novas) { const [k, ] = cells.entries().next().value, cx = Math.floor(k / M), cy = k - cx * M, N = 2 ** Z; map.setView([Math.atan(Math.sinh(Math.PI * (1 - 2 * (cy + .5) / N))) * 180 / Math.PI, (cx + .5) / N * 360 - 180], Math.max(map.getZoom(), 12)); }
}

/* ---------- Posição ao vivo ---------- */
let watch = null;
$('loc').onclick = () => {
  if (watch !== null) { navigator.geolocation.clearWatch(watch); watch = null; $('loc').classList.remove('on'); return; }
  if (!navigator.geolocation) return toast('Geolocalização indisponível neste navegador.');
  let first = true;
  watch = navigator.geolocation.watchPosition(p => {
    add(p.coords.latitude, p.coords.longitude, rad());
    if (first) { map.setView([p.coords.latitude, p.coords.longitude], Math.max(map.getZoom(), 16)); first = false; }
    schedule(); save(); stats();
  }, err => { toast('Sem acesso à localização (' + err.message + ').'); watch = null; $('loc').classList.remove('on'); }, { enableHighAccuracy: true });
  $('loc').classList.add('on');
};

/* ---------- UI ---------- */
function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 5000); }
function stats() { $('stat').textContent = cells.size.toLocaleString('pt-BR') + ' células reveladas'; }
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.m));
$('rad').oninput = () => $('radv').textContent = rad() + ' m';
$('done').onclick = finishPath; $('undo').onclick = undo;
$('imp').onclick = () => $('file').click();
$('file').onchange = e => { importFiles([...e.target.files]); e.target.value = ''; };
$('exp').onclick = exportBackup;
$('fogchk').onchange = e => { fogOn = e.target.checked; schedule(); };
$('min').onclick = () => { const u = $('ui'); u.classList.toggle('min'); $('min').textContent = u.classList.contains('min') ? '+' : '–'; };
$('wipe').onclick = () => { if (confirm('Apagar todo o progresso? Salve um backup antes.')) { cells.clear(); history.length = 0; schedule(); save(); stats(); } };
$('q').onkeydown = async e => {
  if (e.key !== 'Enter' || !e.target.value.trim()) return;
  try {
    const r = await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(e.target.value))).json();
    r[0] ? map.setView([+r[0].lat, +r[0].lon], 13) : toast('Lugar não encontrado.');
  } catch (err) { toast('Busca indisponível agora.'); }
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.key === 'Enter' && mode === 'path') finishPath();
  if (e.key === 'Escape') cancelPath();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
});
['dragover', 'drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); if (t === 'drop') importFiles([...e.dataTransfer.files]); }));

/* ---------- Início ---------- */
(async () => {
  let v = null;
  try {
    const a = await kvGet('cells');
    if (a) for (let i = 0; i < a.length; i += 2) cells.set(a[i], a[i + 1]);
    v = await kvGet('view');
  } catch (e) { toast('Armazenamento do navegador indisponível; use "Salvar backup".'); }
  v ? map.setView([v[0], v[1]], v[2]) : map.setView([20, 0], 3);
  stats(); schedule();
})();
</script>
</body>
</html>
